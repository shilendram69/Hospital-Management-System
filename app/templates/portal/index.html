{% extends "base.html" %}
{% block title %}Patient Portal{% endblock %}
{% block content %}
<div class="page-header"><h1>Patient Portal</h1></div>
<div class="card" style="max-width:500px"><div class="card-body">
<p class="text-muted">Enter Patient UHID to view appointments, records and bills.</p>
<form method="POST" action="{{ url_for('portal.search') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">UHID</label>
<input type="text" name="uhid" class="form-control" placeholder="HMS-YYYYMMDD-XXXX" required></div>
<button type="submit" class="btn btn-primary">Search</button>
</form></div></div>
{% endblock %}
