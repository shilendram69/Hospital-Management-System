{% extends "base.html" %}
{% block title %}Radiology Report{% endblock %}
{% block content %}
<div class="page-header"><h1>Report — {{ order.order_number }}</h1>
<p>{{ order.patient.full_name if order.patient else '' }} · {{ order.test.name if order.test else '' }}</p></div>
<div class="card"><div class="card-body"><form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Report</label><textarea name="report" class="form-control" rows="10" required>{{ order.report or '' }}</textarea></div>
<button type="submit" class="btn btn-primary">Save Report</button>
</form></div></div>
{% endblock %}
