{% extends "base.html" %}
{% block title %}Radiology Order{% endblock %}
{% block content %}
<div class="page-header"><h1>New Radiology Order</h1></div>
<div class="card"><div class="card-body"><form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Patient</label>
<select name="patient_id" class="form-select" required><option value="">Select</option>
{% for p in patients %}<option value="{{ p.id }}">{{ p.full_name }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Doctor</label>
<select name="doctor_id" class="form-select"><option value="">Select</option>
{% for d in doctors %}<option value="{{ d.id }}">{{ d.user.full_name if d.user else d.id }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Test</label>
<select name="test_id" class="form-select" required><option value="">Select</option>
{% for t in tests %}<option value="{{ t.id }}">{{ t.name }} (₹{{ t.price }})</option>{% endfor %}</select></div>
<div class="col-md-12"><label class="form-label">Clinical Indication</label><textarea name="clinical_indication" class="form-control" rows="2"></textarea></div>
</div>
<button type="submit" class="btn btn-primary mt-3">Create Order</button>
</form></div></div>
{% endblock %}
